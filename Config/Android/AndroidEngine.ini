; Per-pass GPU stats on the headset (csvprofile's GPU/ columns); the timestamp queries they need are switched on
; in DefaultDeviceProfiles.ini, since that cvar only takes device-profile values.
[SystemSettings]
r.GPUStatsEnabled=1
; (STUTTER) the purge after a GC spread thinner: 1 ms a frame, not 2 (the first GC after a load left ~3 s of 28-35 ms frames)
gc.IncrementalGCTimePerFrame=0.001
