; GPU timing on the Quest (OutlawsPerf, stat unit, csvprofile): UE 5.1 declares r.Vulkan.SupportsTimestampQueries
; "set by device profile", so an ini [SystemSettings] line is ignored; the headset picks Oculus_Quest2 (parent Oculus_Quest).
[Oculus_Quest DeviceProfile]
+CVars=r.Vulkan.SupportsTimestampQueries=1
; GPU hang hunt (2026-09-30): the Adreno faults ("CP opcode error", unmapped IB) always left the game waiting on
; occlusion results; with occlusion queries off, a 4-minute heavy session ran clean. Off on the Quest while we confirm.
+CVars=r.AllowOcclusionQueries=0
