; BUG-FOVCLIP: the held gear and the text plates are pulled along each line of sight to 10 to 14 cm from the eye
; (M_OLR_Held, M_OLR_TextPlate_Q); with the 10 cm default near plane, the view depth of a point that far out but
; off to the side (radius x cos of the angle) fell behind the near plane, so the numbers and guns were clipped
; well before the edge of the Quest's view.  3 cm keeps them in front of it to about 70 degrees off axis.
NearClipPlane=3.0
